services:
  wirjodihardjo-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wirjodihardjo-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      # Foto profil & media unggahan tersimpan permanen di host.
      - ./uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://wirjo:wirjo_secret@wirjodihardjo-db:5432/wirjodihardjo
      NEXTAUTH_URL: https://wirjodihardjo.teknoloka.id
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}"
      AUTH_TRUST_HOST: "true"
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://wirjodihardjo-redis:6379
      UPLOADTHING_SECRET: "${UPLOADTHING_SECRET:-}"
      UPLOADTHING_APP_ID: "${UPLOADTHING_APP_ID:-}"
    depends_on:
      wirjodihardjo-db:
        condition: service_healthy
      wirjodihardjo-redis:
        condition: service_started
    networks:
      - teknoloka-network

  wirjodihardjo-db:
    image: postgres:17-alpine
    container_name: wirjodihardjo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wirjodihardjo
      POSTGRES_USER: wirjo
      POSTGRES_PASSWORD: wirjo_secret
    volumes:
      - wirjodihardjo-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wirjo -d wirjodihardjo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teknoloka-network

  wirjodihardjo-redis:
    image: redis:7-alpine
    container_name: wirjodihardjo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - wirjodihardjo-redisdata:/data
    ports:
      - "127.0.0.1:6381:6379"
    networks:
      - teknoloka-network

volumes:
  wirjodihardjo-pgdata:
  wirjodihardjo-redisdata:

networks:
  teknoloka-network:
    external: true